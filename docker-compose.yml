version: '3.8'
services:
  postgres:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanshield -d urbanshield"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: urbanshield
      POSTGRES_PASSWORD: password
      POSTGRES_DB: urbanshield

  backend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://urbanshield:password@postgres:5432/urbanshield
      JWT_SECRET: change-this-to-random-256bit-secret
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000

volumes:
  postgres_data:
